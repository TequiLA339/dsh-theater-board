.app-shell.detail-mode main{

  grid-template-columns:minmax(360px,38%) minmax(0,1fr);

.app-shell.detail-mode .focus-summary{
  grid-column:1;grid-row:1 / -1;
  position:relative;isolation:isolate;overflow:hidden;
  height:100dvh;min-height:680px;
  padding:88px 48px 40px;
  background:
    radial-gradient(120% 70% at 15% 10%,#ffffff 0,#ffffff00 55%),
    radial-gradient(90% 60% at 100% 100%,#cbd4dc 0,#cbd4dc00 70%),
    linear-gradient(160deg,#f5f8fa 0%,#e6ebf0 55%,#d2dae2 100%);
  border-right:1px solid #e5eaf0;
  grid-template-rows:minmax(0,1fr) auto auto minmax(0,1fr);
  animation:panel-in .45s both;
}
.app-shell.detail-mode .focus-summary:before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--grain);opacity:.32;mix-blend-mode:multiply;
}
.app-shell.detail-mode .focus-summary:after{
  content:"";position:absolute;z-index:-1;pointer-events:none;
  width:70%;aspect-ratio:1;right:-18%;top:12%;border-radius:50%;
  background:radial-gradient(circle,var(--glow,#ab343c22) 0,transparent 65%);
  filter:blur(10px);
}

.app-shell.detail-mode .focus-summary:has(.movement){--glow:#25847426}
.app-shell.detail-mode .focus-summary:has(.opening){--glow:#48657b26}
